<div class="container">

  <div class="display-4 text-center">Cadastro de Cidade</div>

  <form [formGroup]="formGroupProductCards">

   <div class="mb-3">
      <label for="inputImg" class="form-label">Imagem</label>
      <input formControlName="img" type="url" class="form-control" id="inputImg">
    </div>

    <div class="mb-3">
      <label for="inputName" class="form-label">Nome</label>
      <input formControlName="name" type="text" class="form-control" id="inputName">
    </div>

    <div class="mb-3">
      <label for="inputDescription" class="form-label">Descrição</label>
      <input formControlName="description" type="text" class="form-control" id="inputDescription">
    </div>

    <div class="mb-3">
      <label for="inputArea" class="form-label">Area</label>
      <input formControlName="area" type="text" class="form-control" id="inputArea">
    </div>

     <div class="mb-3">
      <label for="inputEstado" class="form-label">Estado</label>
      <input formControlName="estado" type="text" class="form-control" id="inputEstado">
    </div>

    <button type="submit" class ="btn btn-primary" (click)="save()"> Salvar</button>
  </form>


  Total de produtos: {{products.length}}

  <section class="card mb-3" style="max-width: 320px" *ngFor="let p of products">
    <img src={{p.img}} class="card-img-top" alt="...">
    <div class="card-body">
      <h4 class="card-title">{{p.name}}</h4>
      <p class="card-text">{{p.description}}</p>
      <p class="card-text">{{p.area}}</p>
      <p class="card-text">{{p.estado}}</p>
    </div>
  </section>

</div>
